<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esto es Norte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo difuminado -->
    <div class="background-blur"></div>
    
    <!-- Contenido principal -->
    <div class="container">
        <!-- Foto principal -->
        <div class="main-photo">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Paisaje del Norte">
        </div>
        
        <!-- Instagram feed -->
        <div class="instagram-section">
            <h2>@estoesnorte</h2>
            <div class="instagram-grid" id="instagram-feed">
                <!-- Las fotos de Instagram se cargarán aquí -->
                <div class="instagram-placeholder">
                    <p>Cargando fotos de Instagram...</p>
                    <p class="note">Nota: Para ver las fotos reales de @estoesnorte, necesitarás conectar con la API de Instagram o usar un servicio de embedding.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
